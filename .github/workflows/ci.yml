name: ci

# Checks every pull request before it is merged: Python tests, front-end tests and a build with the
# latest data. Builds only; nothing is deployed. Added 2026-11-27 because local builds on the
# maintainer's PC are blocked by Windows Application Control (Rollup native file).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out data branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Python tests (PRD 6)
        run: python -m unittest discover -s tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (locked versions)
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Front-end tests
        working-directory: web
        run: npm test
      - name: Build with the latest data
        working-directory: web
        env:
          TZ: Asia/Taipei
        run: |
          node scripts/prepare-data.mjs ../data
          npm run build
          test -f dist/index.html && test -f dist/sw.js
