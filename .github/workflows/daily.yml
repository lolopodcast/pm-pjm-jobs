name: daily

# PRD 2.1 第 5 點: 03:05 Asia/Taipei = 19:05 UTC. workflow_dispatch allows a manual re-run (PRD 3 第 6 點).
on:
  schedule:
    - cron: "5 19 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit to the data branch (PRD 11.3 第 5 點)

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # ~38 min crawl + up to 300 AI analyses (~19 s each). The pipeline stops AI work 140 min after it
    # starts (RUN_TIME_BUDGET_MIN), leaving time to commit; a job timeout would lose the whole day's work.
    timeout-minutes: 180
    steps:
      - name: Check out code (main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out data branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: data
          path: data

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      - name: Crawl, analyse and update data
        env:
          TZ: Asia/Taipei
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pipeline run --data-dir data

      # Runs even when the previous step failed (e.g. too many AI failures), so the day's crawl is kept.
      # If the crawl itself aborted, nothing was written and there is nothing to commit.
      - name: Commit to data branch
        if: ${{ !cancelled() }}
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -q -m "Daily update $(TZ=Asia/Taipei date +%F)"
            git push -q origin HEAD:data
          fi

      - name: Summary
        if: always()
        run: |
          if [ -f data/run_summary.json ]; then
            python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("data/run_summary.json", encoding="utf-8"))
          print("| 項目 | 數值 |\n|---|---|")
          for k in ("date", "crawl_complete", "jobs_seen", "targets", "new", "seen_existing", "reopened",
                    "newly_closed", "archived", "open", "closed", "ai_attempted", "ai_done", "ai_failed",
                    "ai_quota_stop", "ai_time_stop", "pending_ai", "unmatched_companies"):
              print(f"| {k} | {s.get(k)} |")
          EOF
          fi

  # Rebuild the website with today's data. Runs even if the crawl job failed late (data may still
  # have been committed); a crawl that wrote nothing just redeploys yesterday's data.
  deploy:
    needs: crawl
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
