name: deploy

# Build the website with the latest data branch and publish it to GitHub Pages (PRD 11.3).
# Runs after the daily job (called from daily.yml), when site code or vocabulary changes, or by hand.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "vocab/**", ".github/workflows/deploy.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out data branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: data
          path: data
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (locked versions)
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Copy data and build
        working-directory: web
        env:
          TZ: Asia/Taipei
        run: |
          node scripts/prepare-data.mjs ../data
          npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
