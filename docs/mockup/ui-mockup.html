function renderFitChecklist() {
  if (!fitChecklistHost) return;
  const done = analysed(JOBS.filter((j) => j.status === 'open'));
  const freq = (id) => done.filter((j) => [...j.k, ...j.s, ...j.a, ...j.tk].includes(id)).length;
  const group = (cat, titleKey) => {
    const ids = Object.keys(V).filter((id) => V[id][0] === cat).sort((a, b) => freq(b) - freq(a));
    return h('div', { class: 'skill-group' }, h('p', { class: 'eyebrow', style: 'margin-top:8px' }, tr(titleKey)),
      cat === 'K' ? eduPicker() : null,
      ids.map((id) => h('div', { class: 'skill-row' },

        h('div', { class: 'lv', role: 'group', 'aria-label': vz(id) }, [[0, 'lv0'], [0.5, 'lv1'], [1, 'lv2']].map(([v, k]) =>

  };
  fitChecklistHost.replaceChildren(group('S', 'fit_s'), group('K', 'fit_k'), group('T', 'fit_t'), group('A', 'fit_a'));
}
function updateFitResults() {
  if (!fitResultsHost) return;
  const done = analysed(JOBS.filter((j) => j.status === 'open'));
  const ranked = done.map((j) => ({ j, v: fitScore(j) })).sort((a, b) => b.v - a.v);
  const gaps = countBy(done, (j) => [...j.k, ...j.s, ...j.a, ...j.tk].filter((id) => !S.fit[id])).slice(0, 10).map(([id, n]) => ({ id, label: vz(id), n }));
  const mine = Object.keys(DOM).map((d) => Object.entries(S.fit).filter(([id]) => V[id] && V[id][3] === d).reduce((a, [, w]) => a + w, 0));
  const tot = mine.reduce((a, b) => a + b, 0) || 1;
  const mineN = mine.map((x) => Math.round((x / tot) * 100));
  const avgDm = Object.keys(DOM).map((_, i) => Math.round(done.reduce((a, j) => a + j.dm[i], 0) / done.length));
  fitResultsHost.replaceChildren(
    h('div', { class: 'card' }, h('div', { class: 'sec-h' }, h('h2', null, tr('fit_res')), h('span', { class: 'mini' }, '≥70% ' + tr('hi') + ' · 40–69% ' + tr('mid') + ' · <40% ' + tr('lo'))),
      ranked.slice(0, 6).map(({ j, v }) => h('div', { class: 'match' },
        h('div', { style: 'min-width:0' }, h('div', { style: 'font-weight:600' }, pick(j.t)), h('div', { class: 'mini' }, pick(j.co) + ' · ' + j.role)),
        h('span', { class: 'fit ' + fitLevel(v) }, v + '%'))),
      h('p', { class: 'chart-note' }, tr('fit_disc'))),
    h('div', { class: 'card' }, h('div', { class: 'sec-h' }, h('h2', null, tr('fit_gap'))),
      bars(gaps, 'var(--c5)', (r) => { S.f.tag = r.id; go('jobs'); })),
    h('div', { class: 'card' }, h('div', { class: 'sec-h' }, h('h2', null, tr('fit_radar'))),
      h('div', { class: 'radar-wrap' }, radarSVG([{ v: avgDm, color: 'var(--c3)' }, { v: mineN, color: 'var(--c1)' }], 300)),
      legend([[tr('me'), 'var(--c1)'], [tr('avg'), 'var(--c3)']])));
}
